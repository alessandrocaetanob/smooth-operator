version: 2.1

orbs:
  node: circleci/node@7.2.1
  codecov: codecov/codecov@6.0.0

executors:
  dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    resource_class: medium
  node-lts:
    docker:
      - image: cimg/node:22.12
    resource_class: medium
  # machine executor for multi-arch buildx — needs a real Linux VM (not a
  # remote Docker host) so QEMU emulation for arm64 builds works reliably.
  linux-vm:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    resource_class: medium

jobs:
  backend-ci:
    executor: dotnet
    steps:
      - checkout
      - restore_cache:
          keys:
            - dotnet-nuget-v1-{{ checksum "smooth-operator.sln" }}
            - dotnet-nuget-v1-
      - run:
          name: Restore dependencies
          command: dotnet restore smooth-operator.sln
      - save_cache:
          key: dotnet-nuget-v1-{{ checksum "smooth-operator.sln" }}
          paths:
            - /root/.nuget/packages
      - run:
          name: Check formatting
          command: dotnet format smooth-operator.sln --verify-no-changes --verbosity diagnostic
      - run:
          name: Build
          command: |
            dotnet build smooth-operator.sln \
              --configuration Release \
              --no-restore \
              /p:TreatWarningsAsErrors=false \
              /p:EnforceCodeStyleInBuild=true \
              /p:AnalysisLevel=latest
      - run:
          name: Run tests with coverage
          # 30m gives ~10m headroom over the previous tight 20m ceiling. The Api.Tests
          # integration suite — WebApplicationFactory + EF Core InMemory SQLite, ~450
          # tests — runs under coverlet instrumentation here, which is roughly 5x slower
          # than the bare local run.
          no_output_timeout: 30m
          command: |
            # `-m:1` forces MSBuild to run test projects sequentially (default is one
            # worker per CPU, i.e. 2 on the medium executor). When projects run in
            # parallel each project's stdout is buffered until it completes — Api.Tests
            # is the slowest, and once the four lighter projects finished, no output
            # reached CircleCI for the rest of Api.Tests's run, tripping
            # no_output_timeout even though tests were progressing.
            dotnet test smooth-operator.sln -m:1 \
              --configuration Release \
              --no-build \
              --verbosity normal \
              --settings coverlet.runsettings \
              --collect:"XPlat Code Coverage" \
              --results-directory ./TestResults
      - run:
          name: Install gpg for Codecov CLI validation
          command: apt-get update -qq && apt-get install -y --no-install-recommends gnupg
      - codecov/upload:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: backend
      - persist_to_workspace:
          root: .
          paths:
            - TestResults
      - store_artifacts:
          path: ./TestResults
          destination: backend-coverage

  frontend-ci:
    executor: node-lts
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: frontend
      - run:
          name: Check formatting
          working_directory: frontend
          # Uses the prettier installed by `npm ci` above, so the version is
          # single-sourced from package-lock.json. A hard-pinned `prettier@X`
          # here would silently drift from the lockfile and reject formatting
          # that a contributor's local `npx prettier --write .` produced.
          command: npm run format:check
      - run:
          name: Lint
          working_directory: frontend
          command: npm run lint
      - run:
          name: Build
          working_directory: frontend
          command: npm run build
      - run:
          name: Upload bundle analysis to Codecov
          working_directory: frontend
          # Informational only — never fail the build if the token is absent
          # (e.g. forked-PR runs) or the analyzer service is unreachable.
          command: |
            if [ -n "$CODECOV_TOKEN" ]; then
              npx --yes @codecov/bundle-analyzer ./dist/frontend/browser \
                --bundle-name=smooth-operator-frontend \
                --upload-token="$CODECOV_TOKEN" || echo "Bundle analysis upload failed (non-fatal)."
            else
              echo "CODECOV_TOKEN not set — skipping bundle analysis upload."
            fi
      - run:
          name: Run tests with coverage (filtered, enforces 80% TS-only thresholds)
          working_directory: frontend
          command: npm run test:coverage
          environment:
            CI: "true"
      - codecov/upload:
          files: frontend/coverage/frontend/clover.xml
          flags: frontend
      - persist_to_workspace:
          root: .
          paths:
            - frontend/coverage
      - store_artifacts:
          path: frontend/coverage
          destination: frontend-coverage

  # Security gate (HYP-38): fail the build when any direct or transitive npm
  # dependency has a known high/critical vulnerability. `npm audit` only needs
  # the lockfile — no install step, so the job stays fast.
  dependency-audit-node:
    executor: node-lts
    steps:
      - checkout
      - run:
          name: npm audit (frontend) — fail on high/critical
          working_directory: frontend
          command: npm audit --audit-level=high
      - run:
          name: npm audit (docs) — fail on high/critical
          working_directory: docs
          command: npm audit --audit-level=high

  # Security gate (HYP-38): fail the build when any NuGet package (including
  # transitives) has a known High/Critical advisory. Moderate/Low are reported
  # but do not fail the build.
  dependency-audit-dotnet:
    executor: dotnet
    steps:
      - checkout
      - restore_cache:
          keys:
            - dotnet-nuget-v1-{{ checksum "smooth-operator.sln" }}
            - dotnet-nuget-v1-
      - run:
          name: Restore dependencies
          command: dotnet restore smooth-operator.sln
      - run:
          name: dotnet vulnerable-package check — fail on High/Critical
          command: |
            dotnet list smooth-operator.sln package --vulnerable --include-transitive | tee vulnerable-packages.txt
            if grep -qiE '(High|Critical)[[:space:]]+https://' vulnerable-packages.txt; then
              echo "" >&2
              echo "High/Critical vulnerable NuGet packages detected — see report above." >&2
              exit 1
            fi
      - store_artifacts:
          path: vulnerable-packages.txt
          destination: nuget-vulnerability-report

  # Security gate (HYP-38): build the production images and scan them with
  # Trivy. Fails on HIGH/CRITICAL findings that already have a fix upstream
  # (--ignore-unfixed keeps unpatchable base-image CVEs from blocking CI).
  # The docs image shares the frontend's node+nginx-unprivileged bases, so
  # scanning the frontend image covers it.
  trivy-image-scan:
    executor: linux-vm
    steps:
      - checkout
      - run:
          name: Install Trivy
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sudo sh -s -- -b /usr/local/bin
            trivy --version
      - run:
          name: Build backend image (linux/amd64)
          no_output_timeout: 30m
          command: docker build -t smooth-operator-backend:ci ./backend
      - run:
          name: Build frontend image (linux/amd64)
          no_output_timeout: 30m
          command: docker build -t smooth-operator-frontend:ci ./frontend
      - run:
          name: Trivy scan — backend image (gate)
          command: |
            trivy image --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 smooth-operator-backend:ci
      - run:
          name: Trivy scan — frontend image (gate)
          command: |
            trivy image --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 smooth-operator-frontend:ci
      - run:
          name: Trivy scan — guacd base image (informational)
          # Third-party image we don't build; report but never block on it.
          command: |
            GUACD_IMAGE=$(grep -oE 'guacamole/guacd:[0-9.]+' docker-compose.yml | head -1)
            trivy image --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 0 "$GUACD_IMAGE"

  docs-build:
    executor: node-lts
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: docs
      - run:
          name: Docusaurus production build smoke
          working_directory: docs
          command: npm run build

  sonarcloud-scan:
    executor: dotnet
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - dotnet-nuget-v1-{{ checksum "smooth-operator.sln" }}
            - dotnet-nuget-v1-
      - run:
          name: Install Java runtime (required by SonarScanner for .NET)
          command: |
            apt-get update -qq
            apt-get install -y --no-install-recommends openjdk-17-jre-headless
      - run:
          name: Install SonarScanner for .NET
          command: |
            dotnet tool install --global dotnet-sonarscanner
            echo 'export PATH="$PATH:/root/.dotnet/tools"' >> "$BASH_ENV"
      - run:
          name: Begin SonarCloud analysis
          # The css:S8776 ("Missing scoping root") exclusion on frontend/src/styles.css
          # is a parser false positive, not a suppressed defect: Sonar's CSS analyzer
          # does not model Tailwind v4's `@utility` at-rule as a scoping root, so the
          # `&:hover` / `&:active` nesting inside `@utility btn-interactive` reads as
          # unscoped. Nesting `&` inside `@utility` is the documented Tailwind v4 way
          # to give a custom utility its variants, and the block must keep them to stay
          # `@apply`-able from the component layer.
          command: |
            dotnet sonarscanner begin \
              /k:"alessandrocaetanob_smooth-operator" \
              /o:"alessandrocaetanob" \
              /d:sonar.token="$SONAR_TOKEN" \
              /d:sonar.host.url="$SONAR_HOST_URL" \
              /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
              /d:sonar.javascript.lcov.reportPaths="frontend/coverage/frontend/lcov.info" \
              /d:sonar.typescript.lcov.reportPaths="frontend/coverage/frontend/lcov.info" \
              /d:sonar.typescript.tsconfigPath="frontend/tsconfig.app.json" \
              /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/*.spec.ts,**/coverage/**,**/.angular/**,**/environments/**,**/Migrations/**,load-tests/**,backend/benchmarks/**,frontend/scripts/**" \
              /d:sonar.coverage.exclusions="**/Migrations/**,backend/benchmarks/**,load-tests/**,frontend/scripts/**,**/recording-player.component.ts" \
              /d:sonar.issue.ignore.multicriteria="tw4utility" \
              /d:sonar.issue.ignore.multicriteria.tw4utility.ruleKey="css:S8776" \
              /d:sonar.issue.ignore.multicriteria.tw4utility.resourceKey="frontend/src/styles.css"
      - run:
          name: Build solution
          command: dotnet build smooth-operator.sln --configuration Release
      - run:
          name: End SonarCloud analysis
          command: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  publish-images:
    executor: linux-vm
    steps:
      - checkout
      - run:
          name: Resolve image tag from git tag
          command: |
            # CIRCLE_TAG is set when the workflow is triggered by a git tag push.
            # We accept vX.Y or vX.Y.Z (case-insensitive on the leading v) and
            # tag the image with both the exact tag and `latest`.
            if [ -z "$CIRCLE_TAG" ]; then
              echo "CIRCLE_TAG is empty — this job should only run on tag pushes." >&2
              exit 1
            fi
            VERSION="${CIRCLE_TAG#[vV]}"
            echo "export IMAGE_VERSION=\"$VERSION\"" >> "$BASH_ENV"
            echo "export IMAGE_TAG=\"$CIRCLE_TAG\""  >> "$BASH_ENV"
            echo "Building images for $CIRCLE_TAG (version $VERSION)"
      - run:
          name: Enable QEMU + buildx for multi-arch builds
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --use --name so-builder
            docker buildx inspect --bootstrap
      - run:
          name: Log in to Docker Hub
          command: |
            if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN must be set as CircleCI env vars." >&2
              exit 1
            fi
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build and push backend image (linux/amd64,linux/arm64)
          no_output_timeout: 30m
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "alessandrocaetanob/smooth-operator-backend:${IMAGE_TAG}" \
              --tag "alessandrocaetanob/smooth-operator-backend:latest" \
              --push \
              ./backend
      - run:
          name: Build and push frontend image (linux/amd64,linux/arm64)
          no_output_timeout: 30m
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "alessandrocaetanob/smooth-operator-frontend:${IMAGE_TAG}" \
              --tag "alessandrocaetanob/smooth-operator-frontend:latest" \
              --push \
              ./frontend
      - run:
          name: Verify multi-arch manifests on Docker Hub
          command: |
            docker buildx imagetools inspect "alessandrocaetanob/smooth-operator-backend:${IMAGE_TAG}"
            docker buildx imagetools inspect "alessandrocaetanob/smooth-operator-frontend:${IMAGE_TAG}"

workflows:
  ci:
    jobs:
      - backend-ci
      - frontend-ci
      - docs-build
      - dependency-audit-node
      - dependency-audit-dotnet
      - trivy-image-scan
      - sonarcloud-scan:
          requires:
            - backend-ci
            - frontend-ci

  # Triggered by GitHub releases. Accepts vX.Y or vX.Y.Z, lower- or upper-case
  # leading v (matches both the historical V0.9 / v0.9.3 styles in this repo).
  # Each job needs the same tag filter or the workflow won't fire on tag
  # pushes — CircleCI's default ignores tags entirely.
  release:
    jobs:
      - publish-images:
          filters:
            tags:
              only: /^[vV]\d+\.\d+(\.\d+)?$/
            branches:
              ignore: /.*/
