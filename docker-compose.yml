services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    environment:
      # Backend URL the nginx upstream proxies /api/* to. The frontend image
      # parses this at startup and renders the upstream block — works for
      # single-host (default) and split-host deployments alike.
      - API_URL=${API_URL:-http://backend:8080}
      - APP_HELP_URL=${APP_HELP_URL:-https://smooth-operator-docs.pages.dev}
      - APP_DOCS_URL=${APP_DOCS_URL:-https://smooth-operator-docs.pages.dev}
      - APP_FEATURE_FLAGS=${APP_FEATURE_FLAGS:-{}}
    depends_on:
      - backend
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Session recording temp workspace (shared with guacd) and Local-storage destination.
      # Paths are deliberately siblings (not nested) so the inner named volume isn't
      # shadowed by the outer one — that would defeat the Dockerfile permission setup.
      - Recording__LocalPath=/var/recordings-temp
      - Recording__DefaultStoragePath=/var/recordings
      # RDP drive-redirect base path (shared with guacd) — see FileTransferOptions.
      - FileTransfer__DrivePath=/var/file-transfer-temp
    volumes:
      - dp_keys:/data/protection-keys
      # In-progress .guac files written by guacd, read+uploaded by the backend after session-end.
      - recordings_temp:/var/recordings-temp
      # Default destination for the Local storage backend (admins can switch to S3/Azure in settings).
      - recordings_data:/var/recordings
      # Per-session RDP drive-redirect directories (created/removed by GuacamoleProxyService).
      - file_transfer_temp:/var/file-transfer-temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - smooth-operator-net
    deploy:
      # mode: replicated
      # replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 256M

  postgres:
    image: postgres:18.4-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smoothoperator
    # Performance tuning passed as -c flags rather than a mounted config_file:
    # an external config_file would break hba_file/ident_file path resolution
    # in the official image. Sized for the 1 GiB memory limit below.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=120"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=top"
      - "-c"
      - "track_io_timing=on"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - smooth-operator-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smoothoperator"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./observability/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - smooth-operator-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    # Run guacd as the same UID as the backend (1654, from the .NET aspnet:10.0-alpine
    # base image's APP_UID). guacd opens the recording file with mode 0600 (owner-only),
    # so unless both processes share the UID the backend can't read the .guac file back
    # to ship it to S3/Azure/local storage.
    user: "1654:1654"
    volumes:
      # Shared with the backend so the backend can ship the .guac files written
      # here to S3/Azure/local-permanent after the session ends.
      - recordings_temp:/var/recordings-temp
      # Shared with the backend: per-session directories the backend creates and
      # points RDP's `drive-path` at, redirected into the remote desktop as a drive.
      - file_transfer_temp:/var/file-transfer-temp
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ── Docs stack ──────────────────────────────────────────────────────
  # Start with: docker compose --profile docs up -d
  # Core stack only (no docs): docker compose up -d

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    profiles: [docs]
    ports:
      - "3000:8080"
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M

  # ── Observability stack ──────────────────────────────────────────────────────
  # Start with: docker compose --profile observability up -d
  # Core stack only (no observability): docker compose up -d

  loki:
    image: grafana/loki:3.4.1
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env
      - --storage.tsdb.path=/prometheus
    environment:
      # Must match Metrics__BearerToken used by the backend. Override per-environment.
      - METRICS_TOKEN=${METRICS_TOKEN:-dev-metrics-token}
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  tempo:
    image: grafana/tempo:2.8.0
    profiles: [observability]
    command: -config.file=/etc/tempo.yaml
    volumes:
      - tempo_data:/tmp/tempo
      - ./observability/tempo.yaml:/etc/tempo.yaml
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Code Quality ─────────────────────────────────────────────────────────────
  # Start with: docker compose --profile code-quality up -d
  sonarqube:
    image: sonarqube:lts-community
    profiles: [code-quality]
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

volumes:
  postgres_data:
  redis_data:
  loki_data:
  prometheus_data:
  tempo_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  dp_keys:
  recordings_temp:
  recordings_data:
  file_transfer_temp:

networks:
  smooth-operator-net:
    driver: bridge
