services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      - backend
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - dp_keys:/data/protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 256M

  postgres:
    image: postgres:18.4-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smoothoperator
    # Performance tuning passed as -c flags rather than a mounted config_file:
    # an external config_file would break hba_file/ident_file path resolution
    # in the official image. Sized for the 1 GiB memory limit below.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=120"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=top"
      - "-c"
      - "track_io_timing=on"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - smooth-operator-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smoothoperator"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./observability/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - smooth-operator-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M

  # ── Observability stack ──────────────────────────────────────────────────────
  # Start with: docker compose --profile observability up -d
  # Core stack only (no observability): docker compose up -d

  loki:
    image: grafana/loki:3.4.1
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env
      - --storage.tsdb.path=/prometheus
    environment:
      # Must match Metrics__BearerToken used by the backend. Override per-environment.
      - METRICS_TOKEN=${METRICS_TOKEN:-dev-metrics-token}
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  tempo:
    image: grafana/tempo:2.8.0
    profiles: [observability]
    command: -config.file=/etc/tempo.yaml
    volumes:
      - tempo_data:/tmp/tempo
      - ./observability/tempo.yaml:/etc/tempo.yaml
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Code Quality ─────────────────────────────────────────────────────────────
  # Start with: docker compose --profile code-quality up -d
  sonarqube:
    image: sonarqube:lts-community
    profiles: [code-quality]
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - smooth-operator-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

volumes:
  postgres_data:
  redis_data:
  loki_data:
  prometheus_data:
  tempo_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  dp_keys:

networks:
  smooth-operator-net:
    driver: bridge
