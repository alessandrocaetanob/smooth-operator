services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - smooth-operator-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=smoothoperator;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Guacd__Host=guacd
      - Guacd__Port=4822
      - Encryption__Key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # WARNING: FOR DEVELOPMENT ONLY! Use Azure Key Vault or secure secrets management in production
      - Jwt__Key=7e589cea4a11cdcc9c35a1cf55e9cbe2bf793a59d1c7c106e218749b6c2308ad # WARNING: FOR DEVELOPMENT ONLY! Replace with a strong random secret in production
      - Jwt__Issuer=smooth-operator
      - Jwt__Audience=smooth-operator-api
      # Optional: enable Entra ID by setting AzureAd__ClientId and AzureAd__TenantId (and AzureAd__Instance/Domain as needed).
      # - AzureAd__Instance=https://login.microsoftonline.com/
      # - AzureAd__TenantId=<your-tenant-id>
      # - AzureAd__ClientId=<your-client-id>
      - AppUrls__App=http://localhost:4200
      - AppUrls__Frontend=http://localhost:4200
      - Otel__Endpoint=http://tempo:4317
      - Otel__ServiceName=smooth-operator-backend
    depends_on:
      - postgres
      - redis
      - guacd
    restart: unless-stopped
    networks:
      - smooth-operator-net

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smoothoperator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - smooth-operator-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - smooth-operator-net

  guacd:
    image: guacamole/guacd:1.6.0
    ports:
      - "4822:4822"
    restart: unless-stopped
    networks:
      - smooth-operator-net

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - smooth-operator-net

  # ── Observability stack ──────────────────────────────────────────────────────
  # Start with: docker compose --profile observability up -d
  # Core stack only (no observability): docker compose up -d

  loki:
    image: grafana/loki:3.4.1
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - smooth-operator-net

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - smooth-operator-net

  tempo:
    image: grafana/tempo:2.8.0
    profiles: [observability]
    command: -config.file=/etc/tempo.yaml
    ports:
      - "4317:4317"
      - "3200:3200"
    volumes:
      - tempo_data:/tmp/tempo
      - ./observability/tempo.yaml:/etc/tempo.yaml
    restart: unless-stopped
    networks:
      - smooth-operator-net

  # ── Code Quality ─────────────────────────────────────────────────────────────
  # Start with: docker compose --profile code-quality up -d
  sonarqube:
    image: sonarqube:lts-community
    profiles: [code-quality]
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - smooth-operator-net

volumes:
  postgres_data:
  redis_data:
  loki_data:
  prometheus_data:
  tempo_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  smooth-operator-net:
    driver: bridge
