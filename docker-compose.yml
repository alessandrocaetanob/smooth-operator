services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      - backend
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - smooth-operator-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - dp_keys:/data/protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      guacd:
        condition: service_started
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - smooth-operator-net

  postgres:
    image: postgres:18.4-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smoothoperator
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - smooth-operator-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smoothoperator"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - smooth-operator-net

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - smooth-operator-net

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - smooth-operator-net

  # ── Observability stack ──────────────────────────────────────────────────────
  # Start with: docker compose --profile observability up -d
  # Core stack only (no observability): docker compose up -d

  loki:
    image: grafana/loki:3.4.1
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - smooth-operator-net

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env
      - --storage.tsdb.path=/prometheus
    environment:
      # Must match Metrics__BearerToken used by the backend. Override per-environment.
      - METRICS_TOKEN=${METRICS_TOKEN:-dev-metrics-token}
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - smooth-operator-net

  tempo:
    image: grafana/tempo:2.8.0
    profiles: [observability]
    command: -config.file=/etc/tempo.yaml
    volumes:
      - tempo_data:/tmp/tempo
      - ./observability/tempo.yaml:/etc/tempo.yaml
    restart: unless-stopped
    networks:
      - smooth-operator-net

  # ── Code Quality ─────────────────────────────────────────────────────────────
  # Start with: docker compose --profile code-quality up -d
  sonarqube:
    image: sonarqube:lts-community
    profiles: [code-quality]
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - smooth-operator-net

volumes:
  postgres_data:
  redis_data:
  loki_data:
  prometheus_data:
  tempo_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  dp_keys:

networks:
  smooth-operator-net:
    driver: bridge
