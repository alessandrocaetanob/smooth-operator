sonar.projectKey=alessandrocaetanob_smooth-operator
sonar.projectName=smooth-operator
sonar.projectVersion=1.0

# Path to the source directories
sonar.sources=frontend/src,backend/src

# Path to the test directories
sonar.tests=frontend/src,backend/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/*.spec.ts,**/coverage/**,**/.angular/**,**/environments/**

# Test Inclusions
sonar.test.inclusions=**/*.spec.ts,**/*Test.cs,**/*Tests.cs

# Code Coverage (Adjust paths based on your test runner configurations)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.cs.opencover.reportsPaths=backend/tests/**/coverage.opencover.xml,**/coverage.opencover.xml

# TypeScript — point directly at the app/spec configs so SonarQube can resolve
# the extends chain without getting confused by tsconfig.json's project references
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json,frontend/tsconfig.spec.json

# Language specific rules
sonar.sourceEncoding=UTF-8
