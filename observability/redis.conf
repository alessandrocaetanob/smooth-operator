# Redis configuration for Smooth Operator.
#
# Redis holds only ephemeral data: one-time Guacamole tickets (30s TTL) and
# session-state hashes (24h TTL). Eviction is therefore safe and on-disk
# persistence is unnecessary — both choices favour latency and simplicity.
#
# NOTE: Redis does not accept trailing comments on directive lines; every
# comment must be on its own line.

# Memory — keep below the 256 MiB container limit (see docker-compose.yml).
maxmemory 200mb

# Evict least-recently-used keys when the limit is reached.
maxmemory-policy allkeys-lru

# Persistence — nothing in Redis needs to survive a restart, so disable both
# RDB snapshots and the append-only file. A cold cache re-populates on demand.
save ""
appendonly no
