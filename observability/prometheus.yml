global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: smooth-operator-backend
    static_configs:
      - targets: ['backend:8080']
    metrics_path: /metrics
    authorization:
      # Must match Metrics__BearerToken in docker-compose / your production secret manager.
      # Uses env var expansion (requires --config.expand-env on prometheus startup).
      credentials: "${METRICS_TOKEN}"

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
