name: "CodeQL Security Analysis"

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    # Run at 2:30 AM UTC every Monday
    - cron: '30 2 * * 1'
  workflow_dispatch:

jobs:
  analyze-csharp:
    name: Analyze C# Backend
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Restore dependencies
        run: dotnet restore smooth-operator.sln

      - name: Build backend
        run: dotnet build smooth-operator.sln --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        # Uploading results requires GitHub Advanced Security on private
        # repos; mark non-blocking so the analysis still runs and logs.
        continue-on-error: true
        with:
          category: "/language:csharp"

  analyze-javascript:
    name: Analyze TypeScript/JavaScript Frontend
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        # Uploading results requires GitHub Advanced Security on private
        # repos; mark non-blocking so the analysis still runs and logs.
        continue-on-error: true
        with:
          category: "/language:javascript-typescript"
