name: "Docker Security Scan"

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - '**/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker-security.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - '**/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker-security.yml'
  schedule:
    # Run at 4:00 AM UTC every Monday
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  scan-dockerfiles:
    name: Scan Dockerfiles with Hadolint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Hadolint on Frontend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        if: hashFiles('frontend/Dockerfile') != ''
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

      - name: Run Hadolint on Backend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        if: hashFiles('backend/Dockerfile') != ''
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

  scan-docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  scan-images:
    name: Build and Scan Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [frontend, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.component }} image
        if: hashFiles(format('{0}/Dockerfile', matrix.component)) != ''
        run: |
          docker build -t smooth-operator-${{ matrix.component }}:test ${{ matrix.component }}/ || echo "Dockerfile not found for ${{ matrix.component }}"

      - name: Run Trivy vulnerability scanner on image
        if: hashFiles(format('{0}/Dockerfile', matrix.component)) != ''
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: smooth-operator-${{ matrix.component }}:test
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: hashFiles(format('{0}/Dockerfile', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84 # v3
        # Code Scanning upload requires GitHub Advanced Security.
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.component }}-results.sarif'
          category: docker-${{ matrix.component }}
