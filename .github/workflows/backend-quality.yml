name: "Backend Code Quality"

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: Build and Analyze .NET Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/Backend.csproj

    - name: Build with analyzers
      run: |
        dotnet build backend/Backend.csproj \
          --configuration Release \
          --no-restore \
          /p:TreatWarningsAsErrors=false \
          /p:EnforceCodeStyleInBuild=true \
          /p:AnalysisLevel=latest

    - name: Run .NET format check
      run: dotnet format backend/Backend.csproj --verify-no-changes --verbosity diagnostic
      continue-on-error: true

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/Backend.csproj

    - name: Build
      run: dotnet build backend/Backend.csproj --configuration Release --no-restore

    - name: Run tests
      run: |
        if dotnet test --list-tests 2>&1 | grep -q "The following Tests are available"; then
          dotnet test backend/Backend.csproj --configuration Release --no-build --verbosity normal
        else
          echo "No tests found, skipping test execution"
        fi
