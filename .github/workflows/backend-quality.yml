name: "Backend Code Quality"

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: Build and Analyze .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore smooth-operator.sln

      - name: Build with analyzers
        run: |
          dotnet build smooth-operator.sln \
            --configuration Release \
            --no-restore \
            /p:TreatWarningsAsErrors=false \
            /p:EnforceCodeStyleInBuild=true \
            /p:AnalysisLevel=latest

      - name: Run .NET format check
        run: dotnet format smooth-operator.sln --verify-no-changes --verbosity diagnostic

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore smooth-operator.sln

      - name: Build
        run: dotnet build smooth-operator.sln --configuration Release --no-restore

      - name: Run tests
        run: |
          mapfile -t test_projects < <(find backend -type f -name '*Tests*.csproj' 2>/dev/null | sort)

          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No test projects found under backend/, skipping test execution"
            exit 0
          fi

          for project in "${test_projects[@]}"; do
            echo "Running tests for $project"
            dotnet test "$project" \
              --configuration Release \
              --verbosity normal \
              --settings coverlet.runsettings \
              --collect:"XPlat Code Coverage" \
              --results-directory ./TestResults
          done

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool restore
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./coveragereport" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub" \
            -verbosity:Warning || true

      - name: Post coverage summary to job summary
        if: always()
        run: |
          if [ -f ./coveragereport/SummaryGithub.md ]; then
            cat ./coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            ./TestResults/**/coverage.cobertura.xml
            ./coveragereport/
          retention-days: 14
