name: "PR Quality Checks"

on:
  pull_request:
    branches: [ master, main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert|security)(\(.+\))?: ]]; then
            echo "❌ PR title must follow conventional commits format:"
            echo "   type(scope?): description"
            echo "   Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert, security"
            echo "   Example: feat(backend): add user authentication"
            exit 1
          fi
          echo "✅ PR title follows conventional commits format"

      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "❌ PR description is empty. Please provide a description."
            exit 1
          fi
          echo "✅ PR has a description"
