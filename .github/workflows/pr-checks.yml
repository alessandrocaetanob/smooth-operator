name: "PR Quality Checks"

on:
  pull_request:
    branches: [ master, main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert|security)(\(.+\))?: ]]; then
            echo "❌ PR title must follow conventional commits format:"
            echo "   type(scope?): description"
            echo "   Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert, security"
            echo "   Example: feat(backend): add user authentication"
            exit 1
          fi
          echo "✅ PR title follows conventional commits format"

      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "❌ PR description is empty. Please provide a description."
            exit 1
          fi
          echo "✅ PR has a description"

      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files_yaml: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docker:
              - 'docker-compose.yml'
              - '**/Dockerfile'
            workflows:
              - '.github/workflows/**'

      - name: Set job outputs
        id: changes
        run: |
          echo "backend=${{ steps.changed-files.outputs.backend_any_changed }}" >> $GITHUB_OUTPUT
          echo "frontend=${{ steps.changed-files.outputs.frontend_any_changed }}" >> $GITHUB_OUTPUT

    outputs:
      backend-changed: ${{ steps.changed-files.outputs.backend_any_changed }}
      frontend-changed: ${{ steps.changed-files.outputs.frontend_any_changed }}

  backend-checks:
    name: Backend Quality & Security
    needs: pr-validation
    if: needs.pr-validation.outputs.backend-changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Backend.csproj

      - name: Build with analyzers
        run: |
          dotnet build backend/Backend.csproj \
            --configuration Release \
            --no-restore \
            /p:TreatWarningsAsErrors=false \
            /p:EnforceCodeStyleInBuild=true \
            /p:AnalysisLevel=latest

      - name: Check for vulnerable packages
        run: dotnet list backend/Backend.csproj package --vulnerable --include-transitive

  frontend-checks:
    name: Frontend Quality & Security
    needs: pr-validation
    if: needs.pr-validation.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,html,css,scss,json}"

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        # Code Scanning upload requires GitHub Advanced Security to be
        # enabled (or a public repo with code scanning turned on). The
        # Trivy scan above still runs and surfaces findings in job logs.
        continue-on-error: true
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  all-checks-pass:
    name: All Checks Passed
    needs: [pr-validation, backend-checks, frontend-checks, security-scan]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check all job statuses
        run: |
          if [[ "${{ needs.pr-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-checks.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-checks.result }}" == "failure" ]] || \
             [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
