# Development overrides — auto-merged by Docker Compose.
# Contains dev credentials and local service URLs.
# WARNING: Do NOT use these values in production.
services:
  backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=smoothoperator;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Cache__UseRedis=true
      - Guacd__Host=guacd
      - Guacd__Port=4822
      - Encryption__Key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # WARNING: FOR DEVELOPMENT ONLY! Use Docker secrets or a secrets manager in production
      - Jwt__Key=CHANGE_ME_use_openssl_rand_hex_32 # WARNING: FOR DEVELOPMENT ONLY! Generate: openssl rand -hex 32
      - Jwt__Issuer=smooth-operator
      - Jwt__Audience=smooth-operator-api
      # Optional: enable Entra ID by setting AzureAd__ClientId and AzureAd__TenantId (and AzureAd__Instance/Domain as needed).
      # - AzureAd__Instance=https://login.microsoftonline.com/
      # - AzureAd__TenantId=<your-tenant-id>
      # - AzureAd__ClientId=<your-client-id>
      - AppUrls__App=http://localhost:4200
      - AppUrls__Frontend=http://localhost:4200
      - Otel__Endpoint=http://tempo:4317
      - Otel__ServiceName=smooth-operator-backend
      - Metrics__BearerToken=dev-metrics-token # WARNING: FOR DEVELOPMENT ONLY! Use a strong random secret in production
