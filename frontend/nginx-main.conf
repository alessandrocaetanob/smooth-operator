# Main-context nginx configuration for the Smooth Operator frontend.
#
# Replaces the stock /etc/nginx/nginx.conf so we can load the brotli dynamic
# modules (compiled in the Dockerfile) and tune worker settings. The /tmp
# paths below are mandatory: the container runs with read_only:true plus a
# /tmp tmpfs (see docker-compose.yml), so nothing may write outside /tmp.

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes      auto;
worker_rlimit_nofile  8192;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  2048;
}

http {
    # Temp paths under /tmp — required by the read-only root filesystem.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
