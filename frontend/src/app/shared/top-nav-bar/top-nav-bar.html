<div class="flex items-center gap-4">
<!-- Mobile Menu Button -->
<button class="md:hidden text-slate-400 hover:text-slate-100 p-1 rounded-md hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="hidden md:flex items-center text-lg font-black tracking-tighter text-slate-50 dark:text-white uppercase mr-4 drop-shadow-[0_0_8px_rgba(0,102,255,0.5)]">
            SMOOTH OPERATOR
        </div>
<!-- Search Bar -->
<div class="relative hidden sm:block w-64 md:w-80 group">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 group-focus-within:text-blue-500 transition-colors" data-icon="search">search</span>

</div>
</div>
<!-- Trailing Actions -->

<span class="text-xs font-medium text-tertiary">System Status: Optimal</span>
</div>
<div class="flex items-center gap-1 text-slate-400">
<button class="p-2 hover:text-slate-200 rounded-md hover:bg-white/5 transition-colors active:scale-95 duration-200 relative">
<span class="material-symbols-outlined" data-icon="sensors">sensors</span>
</button>
<button class="p-2 hover:text-slate-200 rounded-md hover:bg-white/5 transition-colors active:scale-95 duration-200 relative">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-blue-500"></span>
</button>
</div>
<div class="h-8 w-px bg-white/10 mx-1"></div>
