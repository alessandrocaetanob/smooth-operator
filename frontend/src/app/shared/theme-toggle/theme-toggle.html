@if (variant === 'floating') {
  <button
    type="button"
    (click)="toggle()"
    class="theme-toggle-floating fixed top-4 right-4 z-50 w-10 h-10 rounded-full glass-panel border border-white/10 flex items-center justify-center text-on-surface-variant hover:text-on-surface shadow-lg shadow-black/20 hover:shadow-primary/20 transition-all duration-200 hover:scale-105 active:scale-95 btn-interactive"
    [attr.aria-label]="
      themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
    "
    title="Toggle theme"
  >
    @if (themeService.theme() === 'dark') {
      <span
        class="material-symbols-outlined"
        style="font-variation-settings: 'FILL' 0"
        aria-hidden="true"
        >light_mode</span
      >
    } @else {
      <span
        class="material-symbols-outlined"
        style="font-variation-settings: 'FILL' 1"
        aria-hidden="true"
        >dark_mode</span
      >
    }
  </button>
} @else {
  <button
    type="button"
    (click)="toggle()"
    class="p-2 rounded-md text-on-surface-variant hover:text-on-surface hover:bg-on-surface/5 transition-colors btn-interactive"
    [attr.aria-label]="
      themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
    "
    title="Toggle theme"
  >
    @if (themeService.theme() === 'dark') {
      <span
        class="material-symbols-outlined"
        style="font-variation-settings: 'FILL' 0"
        aria-hidden="true"
        >light_mode</span
      >
    } @else {
      <span
        class="material-symbols-outlined"
        style="font-variation-settings: 'FILL' 1"
        aria-hidden="true"
        >dark_mode</span
      >
    }
  </button>
}
