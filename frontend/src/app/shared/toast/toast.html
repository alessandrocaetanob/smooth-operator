<div
  class="fixed top-4 right-4 z-[90] flex flex-col gap-2 w-[min(360px,calc(100vw-2rem))]"
  role="status"
  aria-live="polite"
>
  @for (t of toasts(); track trackById($index, t)) {
    <div
      @toastEnter
      [class]="
        'relative flex items-start gap-3 border rounded-lg px-4 pt-3 pb-4 shadow-lg shadow-black/20 backdrop-blur-sm text-sm overflow-hidden ' +
        toneClass(t.kind)
      "
    >
      <!-- Status icon -->
      <span class="material-symbols-outlined text-base mt-0.5 shrink-0">{{
        toneIcon(t.kind)
      }}</span>

      <!-- Message -->
      <span class="flex-1 leading-snug">{{ t.message }}</span>

      <!-- Dismiss button -->
      <button
        type="button"
        (click)="dismiss(t.id)"
        class="text-current/60 hover:text-current transition-colors shrink-0 -mt-0.5"
        aria-label="Dismiss notification"
      >
        <span class="material-symbols-outlined text-base">close</span>
      </button>

      <!-- Drain progress bar — animates from 100% → 0% over the toast TTL -->
      <div
        [class]="'absolute bottom-0 left-0 h-[3px] rounded-full opacity-60 ' + drainClass(t.kind)"
        [style.animation]="'toast-drain ' + drainDuration(t) + ' linear forwards'"
      ></div>
    </div>
  }
</div>
