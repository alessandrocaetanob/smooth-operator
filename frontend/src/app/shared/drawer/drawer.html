<!-- Backdrop -->
<div
  @backdrop
  class="fixed inset-0 z-40 bg-black/50 backdrop-blur-[2px]"
  (click)="closed.emit()"
  aria-hidden="true"
></div>

<!-- Drawer panel -->
<aside
  @drawerPanel
  class="fixed inset-y-0 right-0 z-50 flex flex-col w-full max-w-xl bg-surface border-l border-outline-variant/30 shadow-2xl"
  role="dialog"
  [attr.aria-label]="title"
>
  <!-- Header -->
  <div
    class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/20 shrink-0"
  >
    <div>
      <h2 class="text-base font-semibold text-on-surface">{{ title }}</h2>
      @if (subtitle) {
        <p class="text-xs text-on-surface-variant mt-0.5">{{ subtitle }}</p>
      }
    </div>
    <button
      (click)="closed.emit()"
      class="btn-ghost p-2"
      aria-label="Close drawer"
      type="button"
    >
      <span class="material-symbols-outlined text-xl">close</span>
    </button>
  </div>

  <!-- Scrollable body -->
  <div class="flex-1 overflow-y-auto px-6 py-6">
    <ng-content></ng-content>
  </div>
</aside>
