@if (active(); as req) {
  <div
    class="fixed inset-0 z-[80] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"
    (click)="cancel()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="req.title"
  >
    <div
      class="w-full max-w-md bg-slate-900 border border-white/10 rounded-lg p-5 shadow-xl"
      (click)="$event.stopPropagation()"
    >
      <h3 class="text-sm font-semibold text-slate-100 uppercase tracking-widest">
        {{ req.title }}
      </h3>
      <p class="text-sm text-slate-300 mt-3 whitespace-pre-line">{{ req.message }}</p>

      <div class="mt-5 flex justify-end gap-2">
        <button
          type="button"
          (click)="cancel()"
          class="px-3 py-2 text-xs font-medium uppercase tracking-widest text-slate-300 hover:bg-white/5 rounded"
        >
          {{ cancelLabel() }}
        </button>
        <button
          #confirmBtn
          type="button"
          (click)="confirm()"
          [class]="
            'px-4 py-2 text-xs font-bold uppercase tracking-widest text-white rounded disabled:opacity-50 ' +
            (tone() === 'danger' ? 'bg-red-600 hover:bg-red-500' : 'bg-blue-600 hover:bg-blue-500')
          "
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
