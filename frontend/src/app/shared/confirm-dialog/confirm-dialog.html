@if (active(); as req) {
  <div
    @fadeIn
    class="fixed inset-0 z-[80] bg-background/70 backdrop-blur-sm flex items-center justify-center p-4"
    (click)="cancel()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog-title"
  >
    <div
      @scaleIn
      class="w-full max-w-md glass-panel rounded-xl p-6 shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <h3 id="dialog-title" class="text-sm font-semibold text-on-surface uppercase tracking-widest">
        {{ req.title }}
      </h3>
      <p class="text-sm text-on-surface-variant mt-3 whitespace-pre-line">{{ req.message }}</p>

      <div class="mt-6 flex justify-end gap-2">
        <button
          type="button"
          (click)="cancel()"
          class="px-3 py-2 text-xs font-medium uppercase tracking-widest text-on-surface-variant hover:bg-on-surface/5 rounded-lg transition-colors btn-interactive"
        >
          {{ cancelLabel() }}
        </button>
        <button
          #confirmBtn
          type="button"
          (click)="confirm()"
          [class]="
            'px-4 py-2 text-xs font-bold uppercase tracking-widest rounded-lg disabled:opacity-50 btn-interactive transition-colors ' +
            (tone() === 'danger'
              ? 'text-on-error bg-error hover:bg-error/80'
              : 'text-on-primary bg-primary-container hover:bg-primary')
          "
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
