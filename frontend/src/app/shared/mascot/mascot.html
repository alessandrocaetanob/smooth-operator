<div
  class="mascot-container"
  [class.small]="isSmall"
  [class.state-idle]="effectiveState === 'idle'"
  [class.state-typing]="effectiveState === 'typing'"
  [class.state-password]="effectiveState === 'password'"
  [class.state-loading]="effectiveState === 'loading'"
  [class.state-success]="effectiveState === 'success'"
  [class.state-error]="effectiveState === 'error'"
  [class.state-thinking]="effectiveState === 'thinking'"
  [class.state-wave]="effectiveState === 'wave'"
  [class.state-sleep]="effectiveState === 'sleep'"
  [class.state-connected]="effectiveState === 'connected'"
  [class.state-crashed]="effectiveState === 'crashed'"
  [class.state-sso]="effectiveState === 'sso'"
>
  <svg
    viewBox="0 0 200 220"
    xmlns="http://www.w3.org/2000/svg"
    class="mascot-svg"
    aria-hidden="true"
  >
    <!-- Antenna -->
    <line
      x1="100"
      y1="26"
      x2="100"
      y2="50"
      stroke="var(--mascot-chassis-stroke)"
      stroke-width="4"
      stroke-linecap="round"
    />
    <circle cx="100" cy="17" r="11" fill="var(--mascot-antenna)" class="antenna-bulb" />
    <circle cx="100" cy="17" r="5" fill="var(--mascot-screen)" opacity="0.4" />

    <!-- Head chassis -->
    <rect
      x="36"
      y="48"
      width="128"
      height="108"
      rx="30"
      fill="var(--mascot-chassis)"
      stroke="var(--mascot-chassis-stroke)"
      stroke-width="3"
    />

    <!-- Screen / face panel -->
    <rect
      x="50"
      y="62"
      width="100"
      height="76"
      rx="16"
      fill="var(--mascot-screen)"
      stroke="var(--mascot-screen-stroke)"
      stroke-width="1.5"
      class="face-screen"
    />

    <!-- Scan-line overlay (decorative) -->
    <rect x="50" y="62" width="100" height="76" rx="16" fill="url(#scanlines)" opacity="0.06" />

    <!-- Eyes — open (hidden when password, sleep, or crashed) -->
    <g
      class="eyes-open"
      [style.opacity]="
        effectiveState !== 'password' && effectiveState !== 'sleep' && effectiveState !== 'crashed'
          ? '1'
          : '0'
      "
    >
      <!-- Left pupil -->
      <ellipse
        [attr.cx]="74 + eyeOffsetX()"
        [attr.cy]="100 + eyeOffsetY()"
        rx="9"
        ry="11"
        fill="var(--mascot-eye)"
        class="eye left-eye"
      />
      <ellipse
        [attr.cx]="76 + eyeOffsetX()"
        [attr.cy]="97 + eyeOffsetY()"
        rx="3"
        ry="3"
        fill="white"
        opacity="0.5"
      />
      <!-- Right pupil -->
      <ellipse
        [attr.cx]="126 + eyeOffsetX()"
        [attr.cy]="100 + eyeOffsetY()"
        rx="9"
        ry="11"
        fill="var(--mascot-eye)"
        class="eye right-eye"
      />
      <ellipse
        [attr.cx]="128 + eyeOffsetX()"
        [attr.cy]="97 + eyeOffsetY()"
        rx="3"
        ry="3"
        fill="white"
        opacity="0.5"
      />
    </g>

    <!-- Eyes — sleeping (arcs) -->
    <g class="eyes-sleep" [style.opacity]="effectiveState === 'sleep' ? '1' : '0'">
      <path
        d="M65 100 Q74 109 83 100"
        stroke="var(--mascot-eye)"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"
      />
      <path
        d="M117 100 Q126 109 135 100"
        stroke="var(--mascot-eye)"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"
      />
    </g>

    <!-- Eyes — closed/squinting (password state — privacy gesture) -->
    <g class="eyes-closed" [style.opacity]="effectiveState === 'password' ? '1' : '0'">
      <path
        d="M62 100 Q74 95 86 100"
        stroke="var(--mascot-eye)"
        stroke-width="3.5"
        fill="none"
        stroke-linecap="round"
        class="eye-arc left-arc"
      />
      <path
        d="M114 100 Q126 95 138 100"
        stroke="var(--mascot-eye)"
        stroke-width="3.5"
        fill="none"
        stroke-linecap="round"
        class="eye-arc right-arc"
      />
      <!-- Tiny lash flick for charm -->
      <path
        d="M64 96 L60 92"
        stroke="var(--mascot-eye)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.6"
      />
      <path
        d="M84 96 L88 92"
        stroke="var(--mascot-eye)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.6"
      />
      <path
        d="M116 96 L112 92"
        stroke="var(--mascot-eye)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.6"
      />
      <path
        d="M136 96 L140 92"
        stroke="var(--mascot-eye)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.6"
      />
    </g>

    <!-- Mouth — happy smile -->
    <path
      class="mouth mouth-smile"
      d="M82 118 Q100 130 118 118"
      stroke="var(--mascot-eye)"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
      [style.opacity]="
        ['idle', 'typing', 'wave', 'success', 'connected'].includes(effectiveState) ? '1' : '0'
      "
    />
    <!-- Mouth — worried arc -->
    <path
      class="mouth mouth-worried"
      d="M82 125 Q100 116 118 125"
      stroke="var(--mascot-eye)"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
      [style.opacity]="
        effectiveState === 'password' || effectiveState === 'error' || effectiveState === 'crashed'
          ? '1'
          : '0'
      "
    />
    <!-- Mouth — flat line (thinking / loading / sleep) -->
    <path
      class="mouth mouth-flat"
      d="M84 122 Q100 122 116 122"
      stroke="var(--mascot-eye)"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
      [style.opacity]="['thinking', 'loading', 'sleep', 'sso'].includes(effectiveState) ? '1' : '0'"
    />

    <!-- Neck -->
    <rect
      x="84"
      y="154"
      width="32"
      height="14"
      rx="6"
      fill="var(--mascot-chassis)"
      stroke="var(--mascot-chassis-stroke)"
      stroke-width="2"
    />

    <!-- Body -->
    <rect
      x="48"
      y="166"
      width="104"
      height="50"
      rx="20"
      fill="var(--mascot-chassis)"
      stroke="var(--mascot-chassis-stroke)"
      stroke-width="2.5"
    />

    <!-- Chest panel -->
    <rect
      x="64"
      y="178"
      width="72"
      height="28"
      rx="10"
      fill="var(--mascot-screen)"
      stroke="var(--mascot-screen-stroke)"
      stroke-width="1.5"
      opacity="0.8"
    />
    <circle cx="82" cy="192" r="5" fill="var(--mascot-antenna)" class="chest-dot" opacity="0.85" />
    <circle cx="100" cy="192" r="5" fill="var(--mascot-eye)" class="chest-dot" opacity="0.85" />
    <circle cx="118" cy="192" r="5" fill="var(--mascot-hand)" class="chest-dot" opacity="0.85" />

    <!-- Scanlines pattern (subtle decorative texture) -->
    <defs>
      <pattern id="scanlines" x="0" y="0" width="100" height="4" patternUnits="userSpaceOnUse">
        <rect width="100" height="2" fill="white" />
      </pattern>
    </defs>

    <!-- Connected state: sparkle particles that burst outward -->
    <g class="sparkles" [style.opacity]="effectiveState === 'connected' ? '1' : '0'">
      <!-- 8 sparkle dots at cardinal and diagonal positions, animated outward -->
      <circle cx="100" cy="14" r="4" fill="var(--mascot-antenna)" class="sparkle sp-n" />
      <circle cx="155" cy="35" r="3" fill="var(--mascot-eye)" class="sparkle sp-ne" />
      <circle cx="175" cy="100" r="4" fill="var(--mascot-hand)" class="sparkle sp-e" />
      <circle cx="155" cy="165" r="3" fill="var(--mascot-antenna)" class="sparkle sp-se" />
      <circle cx="100" cy="185" r="4" fill="var(--mascot-eye)" class="sparkle sp-s" />
      <circle cx="45" cy="165" r="3" fill="var(--mascot-hand)" class="sparkle sp-sw" />
      <circle cx="25" cy="100" r="4" fill="var(--mascot-antenna)" class="sparkle sp-w" />
      <circle cx="45" cy="35" r="3" fill="var(--mascot-eye)" class="sparkle sp-nw" />
    </g>

    <!-- Thinking state: floating thought dots -->
    <g class="think-dots" [style.opacity]="effectiveState === 'thinking' ? '1' : '0'">
      <circle cx="150" cy="54" r="3" fill="var(--mascot-eye)" class="think-dot td-1" />
      <circle cx="162" cy="41" r="4.5" fill="var(--mascot-eye)" class="think-dot td-2" />
      <circle cx="178" cy="26" r="6" fill="var(--mascot-eye)" class="think-dot td-3" />
    </g>

    <!-- Crashed state: X eyes -->
    <g class="eyes-crashed" [style.opacity]="effectiveState === 'crashed' ? '1' : '0'">
      <!-- Left X -->
      <line
        x1="65"
        y1="91"
        x2="83"
        y2="109"
        stroke="var(--mascot-eye)"
        stroke-width="3.5"
        stroke-linecap="round"
        class="crash-x-line"
      />
      <line
        x1="83"
        y1="91"
        x2="65"
        y2="109"
        stroke="var(--mascot-eye)"
        stroke-width="3.5"
        stroke-linecap="round"
        class="crash-x-line"
      />
      <!-- Right X -->
      <line
        x1="117"
        y1="91"
        x2="135"
        y2="109"
        stroke="var(--mascot-eye)"
        stroke-width="3.5"
        stroke-linecap="round"
        class="crash-x-line"
      />
      <line
        x1="135"
        y1="91"
        x2="117"
        y2="109"
        stroke="var(--mascot-eye)"
        stroke-width="3.5"
        stroke-linecap="round"
        class="crash-x-line"
      />
    </g>

    <!-- SSO state: two dots orbit the face, representing handshake with identity provider -->
    <g class="sso-orbit" [style.opacity]="effectiveState === 'sso' ? '1' : '0'">
      <!-- Faint dashed orbit ring -->
      <circle
        cx="100"
        cy="100"
        r="68"
        fill="none"
        stroke="var(--mascot-eye)"
        stroke-width="1"
        stroke-dasharray="6 5"
        opacity="0.22"
        class="orbit-ring"
      />
      <!-- Leading dot — rotates clockwise -->
      <g class="orbit-arm od-lead">
        <circle cx="168" cy="100" r="5" fill="var(--mascot-eye)" class="orbit-dot" />
      </g>
      <!-- Trailing dot — same arm, 180° out of phase -->
      <g class="orbit-arm od-trail">
        <circle cx="168" cy="100" r="4" fill="var(--mascot-antenna)" class="orbit-dot" />
      </g>
    </g>

    <!-- Crashed state: energy sparks burst outward -->
    <g class="crash-sparks" [style.opacity]="effectiveState === 'crashed' ? '1' : '0'">
      <line
        x1="36"
        y1="56"
        x2="22"
        y2="42"
        stroke="var(--mascot-antenna)"
        stroke-width="2.5"
        stroke-linecap="round"
        class="crash-spark cs-1"
      />
      <line
        x1="164"
        y1="56"
        x2="178"
        y2="42"
        stroke="var(--mascot-antenna)"
        stroke-width="2.5"
        stroke-linecap="round"
        class="crash-spark cs-2"
      />
      <line
        x1="100"
        y1="48"
        x2="100"
        y2="30"
        stroke="var(--mascot-antenna)"
        stroke-width="2.5"
        stroke-linecap="round"
        class="crash-spark cs-3"
      />
      <line
        x1="52"
        y1="66"
        x2="36"
        y2="56"
        stroke="var(--mascot-antenna)"
        stroke-width="2"
        stroke-linecap="round"
        class="crash-spark cs-4"
      />
      <line
        x1="148"
        y1="66"
        x2="164"
        y2="56"
        stroke="var(--mascot-antenna)"
        stroke-width="2"
        stroke-linecap="round"
        class="crash-spark cs-5"
      />
    </g>
  </svg>
</div>
