<div class="mascot-container" [class.small]="isSmall">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="mascot-svg">
    <!-- Antenna -->
    <path d="M100 20 L100 40" stroke="#0066ff" stroke-width="4" stroke-linecap="round" />
    <circle
      cx="100"
      cy="15"
      r="8"
      fill="#4edea3"
      class="antenna-bulb"
      [class.pulse]="!isPasswordFocused"
    />

    <!-- Head Background -->
    <rect
      x="40"
      y="40"
      width="120"
      height="100"
      rx="30"
      fill="#1c2026"
      stroke="#0066ff"
      stroke-width="4"
    />

    <!-- Screen/Face -->
    <rect
      x="50"
      y="55"
      width="100"
      height="70"
      rx="15"
      fill="#0a0e14"
      stroke="#00dce5"
      stroke-width="2"
    />

    <!-- Eyes (Visible when NOT typing password) -->
    <g
      class="eyes"
      [class.hidden]="isPasswordFocused"
      [style.transform]="'translateX(' + eyeOffsetX + 'px)'"
    >
      <ellipse cx="80" cy="90" rx="8" ry="12" fill="#00dce5" class="eye left-eye" />
      <ellipse cx="120" cy="90" rx="8" ry="12" fill="#00dce5" class="eye right-eye" />
    </g>

    <!-- Closed Eyes (Visible when typing password) -->
    <g class="eyes-closed" [class.visible]="isPasswordFocused">
      <path
        d="M70 90 Q80 80 90 90"
        stroke="#00dce5"
        stroke-width="4"
        fill="transparent"
        stroke-linecap="round"
      />
      <path
        d="M110 90 Q120 80 130 90"
        stroke="#00dce5"
        stroke-width="4"
        fill="transparent"
        stroke-linecap="round"
      />
    </g>

    <!-- Hands covering eyes (Visible when typing password) -->
    <g class="hands" [class.visible]="isPasswordFocused">
      <rect x="65" y="80" width="30" height="20" rx="10" fill="#0066ff" />
      <rect x="105" y="80" width="30" height="20" rx="10" fill="#0066ff" />
    </g>

    <!-- Smile -->
    <path
      d="M85 110 Q100 120 115 110"
      stroke="#00dce5"
      stroke-width="3"
      fill="transparent"
      stroke-linecap="round"
      class="smile"
      [class.worried]="isPasswordFocused"
    />
  </svg>
</div>
