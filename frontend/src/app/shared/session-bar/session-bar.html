@if (minimizedSessions().length > 0) {
  <div class="session-bar" role="region" aria-label="Minimized sessions">
    @for (session of minimizedSessions(); track session.connectionId) {
      <div
        class="session-chip"
        role="group"
        [attr.aria-label]="'Minimized session ' + connectionName(session)"
      >
        <button
          class="chip-restore"
          (click)="restore(session)"
          [title]="'Restore: ' + connectionName(session)"
          type="button"
          [attr.aria-label]="'Restore session ' + connectionName(session)"
        >
          <span class="live-dot" aria-hidden="true"></span>
          <span class="chip-name">{{ connectionName(session) }}</span>
          <span class="chip-timer">{{ session.formattedElapsed() }}</span>
        </button>
        <button
          class="chip-close"
          (click)="close(session, $event)"
          title="Terminate session"
          type="button"
          aria-label="Terminate session"
        >
          <span aria-hidden="true">✕</span>
        </button>
      </div>
    }
  </div>
}
