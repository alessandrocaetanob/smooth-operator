<nav
  class="hidden md:flex flex-col fixed left-0 top-16 bottom-0 w-64 z-40 bg-slate-950/90 backdrop-blur-xl border-r border-white/10 shadow-2xl shadow-blue-900/20 font-inter text-xs font-medium uppercase tracking-widest antialiased"
>
  <div class="flex items-center p-6 border-b border-white/10">
    <div
      class="w-10 h-10 rounded bg-blue-600/20 flex items-center justify-center mr-3 border border-blue-500/30"
    >
      <span
        class="material-symbols-outlined text-blue-500"
        style="font-variation-settings: 'FILL' 1"
        >security</span
      >
    </div>
    <div>
      <div class="text-slate-100 font-bold text-sm tracking-widest">COMMAND CENTER</div>
      <div class="text-slate-500 mt-0.5">Active Ops</div>
    </div>
  </div>

  @if (canManageConnections()) {
    <div class="p-4">
      <button
        (click)="newConnection()"
        class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-4 rounded-md transition-all duration-200 text-xs font-bold tracking-widest uppercase"
      >
        <span class="material-symbols-outlined text-sm">add</span>
        New Connection
      </button>
    </div>
  }

  <div class="flex-1 overflow-y-auto py-2">
    <ul class="space-y-1">
      <li class="group">
        <a
          routerLink="/vault"
          routerLinkActive="bg-blue-600/10 text-blue-400 border-r-2 border-blue-500"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 text-slate-500 px-4 py-3 hover:bg-white/5 hover:text-slate-200 transition-all"
        >
          <span class="material-symbols-outlined">dashboard</span>
          <span>The Vault</span>
        </a>
      </li>
      @if (canManageConnections()) {
        <li class="group">
          <a
            routerLink="/connections"
            routerLinkActive="bg-blue-600/10 text-blue-400 border-r-2 border-blue-500"
            class="flex items-center gap-3 text-slate-500 px-4 py-3 hover:bg-white/5 hover:text-slate-200 transition-all"
          >
            <span class="material-symbols-outlined">hub</span>
            <span>Connections</span>
          </a>
        </li>
      }
      @if (canViewCredentials()) {
        <li class="group">
          <a
            routerLink="/credentials"
            routerLinkActive="bg-blue-600/10 text-blue-400 border-r-2 border-blue-500"
            class="flex items-center gap-3 text-slate-500 px-4 py-3 hover:bg-white/5 hover:text-slate-200 transition-all"
          >
            <span class="material-symbols-outlined">key</span>
            <span>Credentials</span>
          </a>
        </li>
      }
      @if (canAccessSettings()) {
        <li class="group">
          <a
            routerLink="/settings"
            routerLinkActive="bg-blue-600/10 text-blue-400 border-r-2 border-blue-500"
            class="flex items-center gap-3 text-slate-500 px-4 py-3 hover:bg-white/5 hover:text-slate-200 transition-all"
          >
            <span class="material-symbols-outlined">settings</span>
            <span>Settings</span>
          </a>
        </li>
      }
    </ul>
  </div>

  <div class="p-3 border-t border-white/10">
    <ul class="space-y-1">
      <li class="group">
        <button
          (click)="logout()"
          class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-red-300 hover:bg-red-500/10 transition-all rounded"
        >
          <span class="material-symbols-outlined text-lg">logout</span>
          <span>Sign out</span>
        </button>
      </li>
    </ul>
  </div>
</nav>
