<nav
  class="hidden md:flex flex-col fixed left-0 top-16 bottom-0 w-64 z-40 glass-panel border-r border-outline-variant/30 shadow-2xl font-inter text-xs font-medium uppercase tracking-widest antialiased"
>
  <div class="flex items-center p-6 border-b border-outline-variant/20">
    <div
      class="w-10 h-10 rounded-lg bg-primary-container/15 flex items-center justify-center mr-3 border border-primary-container/30"
    >
      <span
        class="material-symbols-outlined text-primary"
        style="font-variation-settings: 'FILL' 1"
        >security</span
      >
    </div>
    <div>
      <div class="text-on-surface font-bold text-sm tracking-widest">COMMAND CENTER</div>
      <div class="text-on-surface-variant mt-0.5">Active Ops</div>
    </div>
  </div>

  @if (canManageConnections()) {
    <div class="p-4">
      <button
        (click)="newConnection()"
        class="w-full flex items-center justify-center gap-2 bg-primary-container hover:bg-primary text-on-primary-container py-2.5 px-4 rounded-lg transition-all duration-200 text-xs font-bold tracking-widest uppercase btn-interactive primary-glow-hover"
      >
        <span class="material-symbols-outlined text-sm">add</span>
        New Connection
      </button>
    </div>
  }

  <div class="flex-1 overflow-y-auto py-2">
    <ul class="space-y-1 px-2">
      <li>
        <a
          routerLink="/my-access"
          routerLinkActive="bg-primary-container/15 text-primary border-r-2 border-primary"
          class="flex items-center gap-3 text-on-surface-variant px-3 py-2.5 rounded-lg hover:bg-on-surface/5 hover:text-on-surface transition-all"
        >
          <span class="material-symbols-outlined">verified_user</span>
          <span>My Access</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/vault"
          routerLinkActive="bg-primary-container/15 text-primary border-r-2 border-primary"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 text-on-surface-variant px-3 py-2.5 rounded-lg hover:bg-on-surface/5 hover:text-on-surface transition-all"
        >
          <span class="material-symbols-outlined">dashboard</span>
          <span>My Vaults</span>
        </a>
      </li>
      @if (canManageConnections()) {
        <li>
          <a
            routerLink="/connections"
            routerLinkActive="bg-primary-container/15 text-primary border-r-2 border-primary"
            class="flex items-center gap-3 text-on-surface-variant px-3 py-2.5 rounded-lg hover:bg-on-surface/5 hover:text-on-surface transition-all"
          >
            <span class="material-symbols-outlined">hub</span>
            <span>Connections</span>
          </a>
        </li>
      }
      @if (canViewCredentials()) {
        <li>
          <a
            routerLink="/credentials"
            routerLinkActive="bg-primary-container/15 text-primary border-r-2 border-primary"
            class="flex items-center gap-3 text-on-surface-variant px-3 py-2.5 rounded-lg hover:bg-on-surface/5 hover:text-on-surface transition-all"
          >
            <span class="material-symbols-outlined">key</span>
            <span>Credentials</span>
          </a>
        </li>
      }
      @if (canAccessSettings()) {
        <li>
          <a
            routerLink="/settings"
            routerLinkActive="bg-primary-container/15 text-primary border-r-2 border-primary"
            class="flex items-center gap-3 text-on-surface-variant px-3 py-2.5 rounded-lg hover:bg-on-surface/5 hover:text-on-surface transition-all"
          >
            <span class="material-symbols-outlined">settings</span>
            <span>Settings</span>
          </a>
        </li>
      }
    </ul>
  </div>

  <div class="p-3 border-t border-outline-variant/20">
    <ul>
      <li>
        <button
          (click)="logout()"
          class="w-full flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:text-error hover:bg-error/10 transition-all rounded-lg"
        >
          <span class="material-symbols-outlined text-lg">logout</span>
          <span>Sign out</span>
        </button>
      </li>
    </ul>
  </div>
</nav>
