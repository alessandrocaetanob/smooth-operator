<div class="page-shell">
  <div class="flex flex-col items-center justify-center gap-4 py-20 text-center">
    <app-mascot state="crashed"></app-mascot>
    <p
      class="mt-2 font-mono text-xs font-bold uppercase tracking-widest text-on-surface-variant/60"
      aria-hidden="true"
    >
      {{ 'pages.notFound.errorCode' | translate }}
    </p>
    <h1 class="text-2xl font-bold text-on-surface tracking-tight">
      {{ 'pages.notFound.title' | translate }}
    </h1>
    <p class="max-w-md text-sm text-on-surface-variant">
      {{ 'pages.notFound.message' | translate }}
    </p>
    <a routerLink="/vault" class="btn-primary mt-2">
      <span class="material-symbols-outlined text-base" aria-hidden="true">home</span>
      {{ 'pages.notFound.backToVault' | translate }}
    </a>
  </div>
</div>
