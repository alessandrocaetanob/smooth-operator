<main class="min-h-screen flex items-center justify-center px-app-gutter">
  <div class="glass-panel rounded-xl p-app-margin glow-effect max-w-md w-full text-center">
    @if (errorMessage()) {
      <div class="space-y-app-md">
        <span class="material-symbols-outlined text-4xl text-error">error</span>
        <h1 class="font-h2 text-h2 text-on-background">Sign-in failed</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          {{ errorMessage() }}
        </p>
        <a routerLink="/login" class="btn-primary inline-block px-app-lg py-2.5">Back to sign-in</a>
      </div>
    } @else {
      <div class="space-y-app-md flex flex-col items-center">
        <app-spinner size="md"></app-spinner>
        <h1 class="font-h2 text-h2 text-on-background">Completing sign-in…</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Validating your single sign-on session.
        </p>
      </div>
    }
  </div>
</main>
