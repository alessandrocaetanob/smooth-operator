<!-- Connections Over Time -->
<div class="glass-card p-4 rounded-xl mb-4">
  <p class="text-xs text-on-surface-variant uppercase tracking-wide mb-3">Connections Over Time</p>
  <div class="chart-container">
    <canvas
      #connectionsChart
      id="connectionsChart"
      aria-label="Connections started and ended over time"
    ></canvas>
  </div>
</div>

<!-- Auth Charts (Login timeseries + Outcome breakdown) -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
  <div class="lg:col-span-2 glass-card p-4 rounded-xl">
    <p class="text-xs text-on-surface-variant uppercase tracking-wide mb-3">
      Login Attempts Over Time
    </p>
    <div class="chart-container">
      <canvas #loginChart id="loginChart" aria-label="Login success and failure over time"></canvas>
    </div>
  </div>
  <div class="glass-card p-4 rounded-xl">
    <p class="text-xs text-on-surface-variant uppercase tracking-wide mb-3">Outcome Breakdown</p>
    <div class="chart-container-sm">
      <canvas
        #breakdownChart
        id="breakdownChart"
        aria-label="Audit event outcome breakdown"
      ></canvas>
    </div>
  </div>
</div>

<!-- Audit Event Charts (Top events + Event timeseries) -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
  <div class="glass-card p-4 rounded-xl">
    <p class="text-xs text-on-surface-variant uppercase tracking-wide mb-3">Top 10 Event Types</p>
    <div class="chart-container">
      <canvas
        #topEventsChart
        id="topEventsChart"
        aria-label="Top audit event types by count"
      ></canvas>
    </div>
  </div>
  <div class="glass-card p-4 rounded-xl">
    <p class="text-xs text-on-surface-variant uppercase tracking-wide mb-3">Event Rate by Type</p>
    <div class="chart-container">
      <canvas
        #eventTimeseriesChart
        id="eventTimeseriesChart"
        aria-label="Audit event rate by type over time"
      ></canvas>
    </div>
  </div>
</div>
