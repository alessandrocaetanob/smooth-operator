<div class="p-6 md:p-8">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-100 tracking-tight">Settings</h1>
    <p class="text-sm text-slate-400 mt-1">Manage users, roles and audit history.</p>
  </div>

  <nav class="flex gap-1 border-b border-white/10 mb-6">
    <a
      routerLink="users"
      routerLinkActive="text-blue-400 border-blue-500"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-colors"
    >
      <span class="material-symbols-outlined text-base">group</span>
      Users
    </a>
    <a
      routerLink="email"
      routerLinkActive="text-blue-400 border-blue-500"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-colors"
    >
      <span class="material-symbols-outlined text-base">mail</span>
      Email
    </a>
    <a
      routerLink="audit-logs"
      routerLinkActive="text-blue-400 border-blue-500"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-colors"
    >
      <span class="material-symbols-outlined text-base">receipt_long</span>
      Audit Logs
    </a>
  </nav>

  <router-outlet></router-outlet>
</div>
