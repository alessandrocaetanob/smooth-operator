<div class="page-shell">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-on-surface tracking-tight">Settings</h1>
    <p class="text-sm text-on-surface-variant mt-1">
      Manage users, groups, vaults and system configuration.
    </p>
  </div>

  <nav class="flex gap-1 border-b border-outline-variant/20 mb-6">
    <a
      routerLink="users"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">group</span>
      Users
    </a>
    <a
      routerLink="groups"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">workspaces</span>
      Groups
    </a>
    <a
      routerLink="vaults"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">lock</span>
      Vaults
    </a>
    <a
      routerLink="roles"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">verified_user</span>
      Roles
    </a>
    <a
      routerLink="email"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">mail</span>
      Email
    </a>
    <a
      routerLink="retention"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">schedule</span>
      Retention
    </a>
    <a
      routerLink="audit-logs"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">receipt_long</span>
      Audit Logs
    </a>
  </nav>

  <router-outlet></router-outlet>
</div>
