<!-- Ambient Background Lighting -->
<div class="absolute inset-0 z-0 pointer-events-none">
  <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary-container rounded-full blur-[150px] opacity-10"></div>
  <div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-secondary-container rounded-full blur-[120px] opacity-10"></div>
</div>
<!-- Main Authentication Container -->
<main class="relative z-10 w-full max-w-md px-gutter">
  <div class="glass-panel rounded-xl p-margin glow-effect flex flex-col items-center text-center">
    <!-- Logo area -->
    <div class="mb-lg flex flex-col items-center">
      <div class="w-16 h-16 rounded-full glass-panel flex items-center justify-center mb-md border border-white/20">
        <span class="material-symbols-outlined text-h2 text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">vpn_key</span>
      </div>
      <h1 class="font-h1 text-h1 text-on-background tracking-tighter">Smooth Operator</h1>
      <p class="font-body-sm text-body-sm text-on-surface-variant mt-sm max-w-[280px]">
        Secure, clientless remote access for modern infrastructure.
      </p>
    </div>
    <!-- Authentication Actions -->
    <div class="w-full space-y-md mt-sm">
      @if (providers().entraId) {
        <button type="button"
                (click)="loginWithSso()"
                class="w-full flex items-center justify-center space-x-sm bg-primary-container text-on-primary-container py-md px-lg rounded-lg font-body-md transition-all duration-200 btn-glow border border-transparent">
          <span class="material-symbols-outlined text-body-lg">login</span>
          <span>Sign in with SSO</span>
        </button>
        <div class="flex items-center w-full py-md">
          <div class="flex-grow border-t border-white/10"></div>
          <span class="px-md font-label-caps text-label-caps text-on-surface-variant">OR CONTINUE WITH EMAIL</span>
          <div class="flex-grow border-t border-white/10"></div>
        </div>
      }

      <form class="w-full flex flex-col gap-y-md text-left pb-sm" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div>
          <label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="email">Email Address</label>
          <input class="w-full bg-[#10141a]/50 border border-white/10 rounded-lg px-md py-2.5 text-body-md text-on-background focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-on-surface-variant/30"
                 id="email" formControlName="email" placeholder="admin@company.com" type="email" autocomplete="email"/>
        </div>
        <div>
          <div class="flex justify-between items-center mb-xs">
            <label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
            <a class="font-label-caps text-label-caps text-primary-fixed-dim hover:underline" href="#">Forgot?</a>
          </div>
          <input class="w-full bg-[#10141a]/50 border border-white/10 rounded-lg px-md py-2.5 text-body-md text-on-background focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-on-surface-variant/30"
                 id="password" formControlName="password" placeholder="••••••••" type="password" autocomplete="current-password"/>
        </div>

        @if (errorMessage()) {
          <div class="bg-error-container/30 border border-error/40 text-on-error-container rounded-lg p-sm font-body-sm text-body-sm">
            {{ errorMessage() }}
          </div>
        }

        <button class="w-full flex items-center justify-center bg-surface-variant hover:bg-surface-bright text-on-background py-2.5 px-lg rounded-lg font-body-md transition-colors border border-white/10 mt-xs disabled:opacity-50 disabled:cursor-not-allowed"
                type="submit" [disabled]="submitting() || form.invalid">
          {{ submitting() ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      @if (providers().entraId) {
        <div class="flex items-center justify-center space-x-gutter pt-md pb-sm border-t border-white/10 w-full mt-md">
          <span class="font-label-caps text-label-caps text-on-surface-variant">SUPPORTED SSO PROVIDERS</span>
        </div>
        <div class="flex justify-center space-x-md text-on-surface-variant">
          <div class="glass-panel p-sm rounded flex items-center justify-center hover:bg-white/5 transition-colors cursor-help" title="Microsoft Entra ID">
            <span class="material-symbols-outlined">window</span>
          </div>
        </div>
      }
    </div>
    <!-- Footer Links -->
    <div class="mt-margin pt-md w-full flex justify-between items-center text-on-surface-variant border-t border-white/5">
      <a class="font-body-sm text-body-sm hover:text-primary-fixed-dim transition-colors" href="#">Help</a>
      <a class="font-body-sm text-body-sm hover:text-primary-fixed-dim transition-colors" href="#">Privacy</a>
    </div>
  </div>
  <!-- System Status Indicator -->
  <div class="mt-lg flex items-center justify-center space-x-sm text-on-surface-variant">
    <div class="w-2 h-2 rounded-full bg-tertiary-fixed-dim shadow-[0_0_8px_rgba(78,222,163,0.6)] animate-pulse"></div>
    <span class="font-label-caps text-label-caps">SYSTEM STATUS: OPTIMAL</span>
  </div>
</main>
