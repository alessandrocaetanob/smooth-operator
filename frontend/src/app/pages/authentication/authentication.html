<!-- Floating theme toggle (layout-less page) -->
<app-theme-toggle variant="floating" />
<!-- Ambient Background Lighting -->
<div class="absolute inset-0 z-0 pointer-events-none">
  <div
    class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary-container rounded-full blur-[150px] opacity-10"
  ></div>
  <div
    class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-secondary-container rounded-full blur-[120px] opacity-10"
  ></div>
</div>
<!-- Main Authentication Container -->
<main class="relative z-10 w-full max-w-md px-app-gutter">
  <div class="glass-panel rounded-xl p-app-margin glow-effect flex flex-col items-center text-center">
    <!-- Logo area -->
    <div class="mb-app-lg flex flex-col items-center">
      <div class="mb-app-md">
        <app-mascot
          [state]="mascotState()"
          [trackPointer]="true"
        ></app-mascot>
      </div>
      <h1 class="font-h1 text-h1 text-on-background tracking-tighter">Smooth Operator</h1>
      <p class="font-body-sm text-body-sm text-on-surface-variant mt-app-sm max-w-[280px]">
        Secure, clientless remote access for modern infrastructure.
      </p>
    </div>
    <!-- Authentication Actions -->
    <div class="w-full space-y-app-md mt-app-sm">
      @if (providers().entraId) {
        <button
          type="button"
          (click)="loginWithSso()"
          class="w-full flex items-center justify-center space-x-app-sm bg-primary-container text-on-primary-container py-app-md px-app-lg rounded-lg font-body-md transition-all duration-200 btn-glow border border-transparent"
        >
          <span class="material-symbols-outlined text-body-lg">login</span>
          <span>Sign in with SSO</span>
        </button>
        <div class="flex items-center w-full py-app-md">
          <div class="flex-grow border-t border-white/10"></div>
          <span class="px-app-md font-label-caps text-label-caps text-on-surface-variant"
            >OR CONTINUE WITH EMAIL</span
          >
          <div class="flex-grow border-t border-white/10"></div>
        </div>
      }

      <form
        class="w-full flex flex-col gap-y-app-md text-left pb-app-sm"
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
      >
        <div>
          <label
            class="block font-label-caps text-label-caps text-on-surface-variant mb-app-xs"
            for="email"
            >Email Address</label
          >
          <input
            class="w-full input-field px-app-md py-2.5 text-body-md"
            id="email"
            formControlName="email"
            placeholder="admin@company.com"
            type="email"
            autocomplete="email"
            (input)="onEmailInput($event)"
          />
        </div>
        <div>
          <div class="flex justify-between items-center mb-app-xs">
            <label
              class="block font-label-caps text-label-caps text-on-surface-variant"
              for="password"
              >Password</label
            >
            <a
              class="font-label-caps text-label-caps text-primary-fixed-dim hover:underline"
              href="#"
              >Forgot?</a
            >
          </div>
          <input
            class="w-full input-field px-app-md py-2.5 text-body-md"
            id="password"
            formControlName="password"
            placeholder="••••••••"
            type="password"
            autocomplete="current-password"
            (focus)="onPasswordFocus()"
            (blur)="onPasswordBlur()"
          />
        </div>

        @if (errorMessage()) {
          <div
            class="bg-error-container/30 border border-error/40 text-on-error-container rounded-lg p-app-sm font-body-sm text-body-sm"
          >
            {{ errorMessage() }}
          </div>
        }

        <button
          class="btn-primary w-full justify-center py-2.5 mt-app-xs"
          type="submit"
          [disabled]="submitting() || form.invalid"
        >
          {{ submitting() ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      @if (providers().entraId) {
        <div
          class="flex items-center justify-center space-x-app-gutter pt-app-md pb-app-sm border-t border-white/10 w-full mt-app-md"
        >
          <span class="font-label-caps text-label-caps text-on-surface-variant"
            >SUPPORTED SSO PROVIDERS</span
          >
        </div>
        <div class="flex justify-center space-x-app-md text-on-surface-variant">
          <div
            class="glass-panel p-app-sm rounded flex items-center justify-center hover:bg-white/5 transition-colors cursor-help"
            title="Microsoft Entra ID"
          >
            <span class="material-symbols-outlined">window</span>
          </div>
        </div>
      }
    </div>
    <!-- Footer Links -->
    <div
      class="mt-app-margin pt-app-md w-full flex justify-between items-center text-on-surface-variant border-t border-white/5"
    >
      <a class="font-body-sm text-body-sm hover:text-primary-fixed-dim transition-colors" href="#"
        >Help</a
      >
      <a class="font-body-sm text-body-sm hover:text-primary-fixed-dim transition-colors" href="#"
        >Privacy</a
      >
    </div>
  </div>
  <!-- System Status Indicator -->
  <div class="mt-app-lg flex items-center justify-center space-x-app-sm text-on-surface-variant">
    <div
      class="w-2 h-2 rounded-full bg-tertiary-fixed-dim shadow-[0_0_8px_rgba(78,222,163,0.6)] animate-pulse"
    ></div>
    <span class="font-label-caps text-label-caps">SYSTEM STATUS: OPTIMAL</span>
  </div>
</main>
