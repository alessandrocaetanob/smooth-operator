<div class="page-shell">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-on-surface tracking-tight">Auditing</h1>
    <p class="text-sm text-on-surface-variant mt-1">View audit logs and monitor system metrics.</p>
  </div>

  <nav class="flex gap-1 border-b border-outline-variant/20 mb-6">
    <a
      routerLink="logs"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">receipt_long</span>
      Audit Logs
    </a>
    <a
      routerLink="dashboards"
      routerLinkActive="text-primary border-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-base">dashboard</span>
      Dashboards
    </a>
  </nav>

  <router-outlet></router-outlet>
</div>
