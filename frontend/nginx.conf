# Upstream with a keepalive connection pool — lets proxied API requests reuse
# connections to the backend instead of reconnecting on every request.
# Host and port are rendered at container startup by entrypoint.sh from API_URL
# (default http://backend:8080) so the frontend and backend can sit on
# different hosts without a CORS dance.
upstream backend {
    server ${API_BACKEND_HOST}:${API_BACKEND_PORT};
    keepalive 32;
}

# Maps the Upgrade header so WebSocket requests send "Connection: upgrade"
# while ordinary requests send an empty Connection header (required for the
# upstream keepalive pool above to actually be reused).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    # HTTP/2 — effective when TLS terminates here; harmless behind an
    # HTTP/1.1 reverse proxy / load balancer that handles TLS upstream.
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    # Serve the .br / .gz files precompressed at build time (see Dockerfile)
    # instead of compressing on every request. gzip (dynamic) stays on as a
    # fallback for responses without a precompressed variant.
    brotli_static on;
    gzip_static   on;

    # ── Security ──────────────────────────────────────────────────────────────
    server_tokens off;

    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # NOTE: Only effective when served over TLS. Remove for plain HTTP deployments.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Proxy — API and WebSocket tunnelling ──────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        # Buffer upstream responses; sized for typical JSON / connection-file payloads.
        proxy_buffering    on;
        proxy_buffers      16 16k;
        proxy_busy_buffers_size 32k;
    }

    location /health {
        proxy_pass         http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Caching ───────────────────────────────────────────────────────────────
    # index.html must never be cached so deploys propagate immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "SAMEORIGIN"                      always;
        add_header X-XSS-Protection        "1; mode=block"                   always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # NOTE: Only effective when served over TLS. Remove for plain HTTP deployments.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Content-hashed JS/CSS/fonts/images — safe to cache for a year
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 1y;
        access_log off;
    }

    # Runtime config — written to /tmp by entrypoint.sh; served from there
    location = /config/config.json {
        alias /tmp/nginx-runtime/config.json;
        add_header Cache-Control "no-store" always;
        add_header Content-Type  "application/json" always;
    }

    # Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression (dynamic fallback) ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;
}
